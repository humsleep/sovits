<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<div class="app" id="app">
  <aside class="sidebar" aria-label="사이드바">
    <a class="brand" href="#/studio" aria-label="온음 — 스튜디오로">
      <svg class="logo-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#lg-mark)"/>
        <g fill="#fff">
          <rect class="lb lb1" x="7.75" y="13" width="3" height="6" rx="1.5"/>
          <rect class="lb lb2" x="12.25" y="8.5" width="3" height="15" rx="1.5"/>
          <rect class="lb lb3" x="16.75" y="11" width="3" height="10" rx="1.5"/>
          <rect class="lb lb4" x="21.25" y="14" width="3" height="4" rx="1.5" opacity=".85"/>
        </g>
      </svg>
      <span class="wordmark">온음</span>
    </a>

    <nav class="nav" aria-label="주 메뉴">
      <a class="nav-item" href="#/studio" data-nav="studio" data-tip="스튜디오" data-tip-pos="right" data-tip-rail>
        <svg class="ico" aria-hidden="true"><use href="#i-wave"/></svg><span class="nav-label">스튜디오</span>
      </a>
      <a class="nav-item" href="#/voices" data-nav="voices" data-tip="내 목소리" data-tip-pos="right" data-tip-rail>
        <svg class="ico" aria-hidden="true"><use href="#i-user-voice"/></svg><span class="nav-label">내 목소리</span>
      </a>
      <a class="nav-item" href="#/history" data-nav="history" data-tip="기록" data-tip-pos="right" data-tip-rail>
        <svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg><span class="nav-label">기록</span>
      </a>
      <a class="nav-item" href="#/dictionary" data-nav="dictionary" data-tip="발음 사전" data-tip-pos="right" data-tip-rail>
        <svg class="ico" aria-hidden="true"><use href="#i-book"/></svg><span class="nav-label">발음 사전</span>
        <span class="nav-dot" id="dict-dot" hidden aria-label="저장하지 않은 변경 있음"></span>
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-foot" aria-label="앱 상태" role="region">
      <div class="status-card" id="status-card" data-state="connecting" data-tip-pos="right" data-tip-rail>
        <div class="status-row">
          <span class="status-dot" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="status-text" role="status" aria-live="polite">
            <span class="status-label-row"><span class="status-label" id="status-label">연결 중</span><span class="status-engine" id="status-engine" hidden></span></span>
            <span class="status-sub" id="status-sub">앱에 연결하고 있어요</span>
          </div>
        </div>
        <span class="status-elapsed" id="status-elapsed" aria-hidden="true"></span>
        <div class="ibar status-bar" aria-hidden="true"></div>
      </div>

      <button class="privacy-badge" id="privacy-btn" type="button" aria-haspopup="dialog" aria-expanded="false"
              data-tip="녹음과 텍스트는 이 맥 밖으로 나가지 않습니다" data-tip-pos="right" data-tip-rail>
        <svg class="ico ico-14" aria-hidden="true"><use href="#i-lock"/></svg>
        <span class="privacy-text">녹음과 텍스트는 이 맥 밖으로 나가지 않습니다</span>
      </button>

      <div class="theme-row">
        <div class="segmented seg-sm theme-seg" role="radiogroup" aria-label="화면 테마" id="theme-seg">
          <button type="button" role="radio" data-theme-val="system" aria-label="시스템 설정 따르기" data-tip="시스템 설정 따르기"><svg class="ico ico-14" aria-hidden="true"><use href="#i-monitor"/></svg></button>
          <button type="button" role="radio" data-theme-val="light" aria-label="라이트" data-tip="라이트"><svg class="ico ico-14" aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button type="button" role="radio" data-theme-val="dark" aria-label="다크" data-tip="다크"><svg class="ico ico-14" aria-hidden="true"><use href="#i-moon"/></svg></button>
          <span class="seg-indicator" aria-hidden="true"></span>
        </div>
        <button type="button" class="icon-btn theme-cycle" id="theme-cycle" aria-label="화면 테마" data-tip="화면 테마" data-tip-pos="right">
          <svg class="ico" aria-hidden="true"><use href="#i-monitor"/></svg>
        </button>
        <a class="classic-link" href="/classic/" aria-label="예전 화면 열기" data-tip="예전 화면(Gradio) 열기" data-tip-pos="right"><svg class="ico ico-14" aria-hidden="true"><use href="#i-arrow-up-right"/></svg><span class="classic-label">예전 화면</span></a>
      </div>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div class="banner banner-offline" id="offline-banner" role="alert" hidden>
      <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
      <span>앱에 연결할 수 없어요. 터미널 창을 닫았다면 'start.command'를 다시 실행해 주세요.</span>
      <button type="button" class="btn btn-link" id="reconnect-btn">다시 연결</button>
    </div>
    <div id="pages"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
<div class="sr-only" id="sr-announce" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<audio id="audio" preload="auto" hidden></audio>

<script src="app.js?v=27"></script>
</body>
</html>
